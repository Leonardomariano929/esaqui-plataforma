services:
  - type: web
    name: esaqui-plataforma
    env: python
    plan: free
    buildCommand: "python -m pip install --upgrade pip && python -m pip install -r requirements.txt"
    startCommand: "gunicorn esaqui:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ESAQUI_SECRET_KEY
        generateValue: true
      - key: WHATSAPP_NUMBER
        value: "+244000000000"
      - key: WHATSAPP_MESSAGE
        value: "Olá, gostaria de assistência da ESAQUI. Configure o número real no painel do Render antes de publicar."
      - key: BYBIT_ACCOUNT
        value: "SEU_USUARIO_BYBIT"
        sync: false
      - key: AIRM_ACCOUNT
        value: "SEU_USUARIO_AIRTM"
        sync: false
      - key: GOOGLE_AD_REVENUE_PER_VISIT_USD
        value: "0.0025"
      - key: GOOGLE_AD_REVENUE_PER_VISIT_EUR
        value: "0.0022"
      - key: GOOGLE_AD_REVENUE_PER_ONLINE_USER_USD
        value: "0.00"
      - key: GOOGLE_AD_REVENUE_PER_ONLINE_USER_EUR
        value: "0.00"
      - key: APP_STORE_URL
        value: "https://apps.microsoft.com"
      - key: GOOGLE_PLAY_URL
        value: "https://play.google.com"
