<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Palavra-Passe - ESAQUI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="box" style="width: 420px;">
        <h2>Recuperação de Acesso</h2>
        {% if erro %} <div class="error">{{ erro }}</div> {% endif %}
        {% if sucesso %} <div class="status-badge badge-aprovado" style="display:block; padding:10px; text-align:center; margin-bottom:15px;">{{ sucesso }}</div> {% endif %}
        
        <form action="/recuperar" method="POST">
            <div class="form-group">
                <label>Introduza o seu E-mail ou Número de Telefone</label>
                <input type="text" name="identificador" placeholder="Ex: email@dominio.com ou 9xxxxxxxx" required style="height:46px;">
            </div>
            <div class="form-group">
                <label>Resposta à sua Pergunta Secreta</label>
                <input type="text" name="resposta" placeholder="A resposta definida no cadastro" required style="height:46px;">
            </div>
            <div class="form-group">
                <label>Defina a Nova Palavra-Passe (Mínimo 8 dígitos)</label>
                <input type="password" name="nova_senha" minlength="8" required style="height:46px;">
            </div>
            
            <button type="submit" class="btn-submit" style="background:#003366; height:48px;">Redefinir Credenciais Securitárias</button>
            <div class="form-toggle-links" style="margin-top:15px;"><a href="/login">← Voltar para a Tela de Login</a></div>
        </form>
    </div>
</body>
</html>
