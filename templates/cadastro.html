<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESAQUI - Cadastro</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">ESAQUI</div>
            <h2>Fazer matrícula</h2>
            {% if erro %}<div class="error-box">{{ erro }}</div>{% endif %}

            <form action="/cadastro" method="POST" class="auth-form">
                <div class="field-group">
                    <label>Curso pretendido</label>
                    <select name="curso_id" required>
                        {% for curso in cursos %}
                        <option value="{{ curso.id }}">{{ curso.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field-group">
                    <label>Nome completo</label>
                    <input type="text" name="nome" required>
                </div>
                <div class="field-group">
                    <label>E-mail</label>
                    <input type="email" name="email" required>
                </div>
                <div class="field-group">
                    <label>Telefone</label>
                    <input type="text" name="telefone" required>
                </div>
                <div class="field-group">
                    <label>Senha</label>
                    <div class="password-field">
                        <input id="cadastro-senha" type="password" name="senha" minlength="8" required>
                        <button type="button" class="password-toggle" data-target="cadastro-senha" aria-label="Mostrar senha">Mostrar</button>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="field-group">
                    <label>Pergunta secreta</label>
                    <select name="pergunta" required>
                        <option value="Nome do seu primeiro animal de estimação">Nome do seu primeiro animal de estimação?</option>
                        <option value="Nome da sua primeira escola">Nome da sua primeira escola?</option>
                        <option value="Cidade onde os seus pais se conheceram">Cidade onde os seus pais se conheceram?</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>Resposta secreta</label>
                    <input type="text" name="resposta" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Submeter inscrição</button>
            </form>

            <div class="form-toggle-links social-links-row">
                <a href="https://facebook.com/esaqui" target="_blank" rel="noreferrer">Facebook</a>
                <a href="https://instagram.com/esaqui" target="_blank" rel="noreferrer">Instagram</a>
                <a href="https://www.tiktok.com/@esaqui" target="_blank" rel="noreferrer">TikTok</a>
                <a href="/login">Já tem conta? Faça login</a>
            </div>
        </div>
    </div>
    <script src="/static/javascript/password_toggle.js"></script>
</body>
</html>
